<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Torrent</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    html, body {
      width: 520px;
      min-height: 480px;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────── */
    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .dialog-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .dialog-title .icon {
      color: var(--accent);
    }

    .btn-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-close:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .btn-close svg {
      width: 14px;
      height: 14px;
    }

    /* ── Body ───────────────────────────────────────── */
    .dialog-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Torrent Info ────────────────────────────────── */
    .torrent-info {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .torrent-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
      word-break: break-word;
    }

    .torrent-name-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 2px;
    }

    .uri-textarea {
      width: 100%;
      padding: 7px 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      resize: none;
      outline: none;
      height: 44px;
      line-height: 1.5;
      overflow-y: auto;
      word-break: break-all;
    }
    .uri-textarea:focus {
      border-color: var(--border-default);
    }

    /* ── Form Fields ─────────────────────────────────── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Error Banner ────────────────────────────────── */
    .error-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--red-muted);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-md);
      font-size: 12px;
      color: var(--red);
    }
    .error-banner .icon {
      flex-shrink: 0;
    }

    /* ── Footer ─────────────────────────────────────── */
    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .btn-add {
      min-width: 100px;
    }

    /* ── Loading overlay ─────────────────────────────── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 17, 21, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      z-index: 50;
    }
    .loading-overlay .loading-text {
      font-size: 12px;
      color: var(--text-secondary);
    }

    body { position: relative; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="dialog-header">
    <div class="dialog-title">
      <span id="header-icon" class="icon"></span>
      Add Torrent
    </div>
    <button class="btn-close" id="btn-close" title="Cancel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="dialog-body">

    <!-- Torrent Info -->
    <div class="torrent-info">
      <div>
        <div class="torrent-name-label">Torrent Name</div>
        <div class="torrent-name" id="torrent-name">Loading…</div>
      </div>
      <div class="field-group">
        <div class="field-label">Magnet / URL</div>
        <textarea class="uri-textarea" id="uri-display" readonly></textarea>
      </div>
    </div>

    <!-- Download Directory -->
    <div class="field-group">
      <label class="field-label" for="input-dir">Download Directory</label>
      <div class="field-row">
        <span id="dir-icon" class="icon" style="color:var(--text-tertiary);flex-shrink:0"></span>
        <input type="text" class="input" id="input-dir" placeholder="/var/lib/transmission/downloads" autocomplete="off">
      </div>
    </div>

    <!-- Start Paused -->
    <div class="field-group">
      <label class="checkbox-wrapper" for="input-paused">
        <input type="checkbox" id="input-paused">
        <span>Start paused</span>
      </label>
    </div>

    <!-- Bandwidth Priority -->
    <div class="field-group">
      <label class="field-label" for="input-priority">Bandwidth Priority</label>
      <select class="select" id="input-priority">
        <option value="-1">Low</option>
        <option value="0" selected>Normal</option>
        <option value="1">High</option>
      </select>
    </div>

    <!-- Labels -->
    <div class="field-group">
      <label class="field-label" for="input-labels">Labels <span style="color:var(--text-tertiary);font-weight:400">(comma-separated)</span></label>
      <input type="text" class="input" id="input-labels" placeholder="e.g. movies, hd" autocomplete="off">
    </div>

    <!-- Error -->
    <div class="error-banner hidden" id="error-banner">
      <span id="error-icon" class="icon"></span>
      <span id="error-text"></span>
    </div>

  </div>

  <!-- Footer -->
  <div class="dialog-footer">
    <button class="btn btn-ghost" id="btn-cancel">Cancel</button>
    <button class="btn btn-primary btn-add" id="btn-add">
      <span id="btn-add-icon" class="icon"></span>
      Add Torrent
    </button>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Adding torrent…</div>
  </div>

  <script src="../js/helpers.js"></script>
  <script src="../js/magnet-dialog.js"></script>
</body>
</html>
